<script>

// === FIXED FLOW: QR Unlimited 20ใบก็ขายได้ / Raw 10ใบ/ID + ต่ออายุ 15วัน ===
async function checkQuotaBoth(memberNo){
  try{
    // นับเฉพาะ Raw (has_qr=false) จำกัด 10 ใบ/ID
    // QR (has_qr=true) ไม่จำกัด ไม่นับ
    const {count: rawCount} = await supa.from('market_listings').select('*',{count:'exact',head:true}).eq('seller_member_no', memberNo).eq('status','active').eq('has_qr', false);
    return rawCount||0;
  }catch(e){ return 0; }
}

async function checkQuotaRaw(memberNo){
  return await checkQuotaBoth(memberNo);
}

// === FIXED FLOW: Renew 15 days for both QR and Raw ===
async function renewListing(listingId, isQR){
  try{
    if(!listingId) return;
    const ne = new Date(); ne.setDate(ne.getDate()+15);
    const {error} = await supa.from('market_listings').update({expires_at: ne.toISOString(), status:'active', updated_at: new Date().toISOString()}).eq('id', listingId);
    if(error){ showModal('ต่ออายุไม่สำเร็จ: '+error.message); return; }
    // Update market_cards too if exists
    await supa.from('market_cards').update({expires_at: ne.toISOString(), status:'active'}).eq('id', listingId);
    await supa.from('market_cards').update({expires_at: ne.toISOString(), status:'active'}).eq('card_id', listingId);
    showModal((isQR?'🏆 QR':'📦 Raw')+' ต่ออายุ +15 วัน สำเร็จ!');
    if(typeof checkQuotaAndExpiry==='function') checkQuotaAndExpiry();
  }catch(e){ showModal('Error: '+e.message); }
}



// === FIXED FLOW: Prevent duplicate listing same card ===
async function isCardAlreadyListed(cardId, memberNo){
  try{
    if(!cardId) return false;
    const {data, count} = await supa.from('market_listings').select('id', {count:'exact'}).eq('card_id', cardId).eq('status','active').limit(1);
    if(count && count>0) return true;
    // Fallback check by seller + card id in market_cards
    const {data: data2, count: count2} = await supa.from('market_cards').select('id', {count:'exact'}).eq('card_id', cardId).eq('status','active').limit(1);
    if(count2 && count2>0) return true;
    return false;
  }catch(e){ return false; }
}


// === FIXED FLOW: ซื้อเสร็จ > โอน ถ้าไม่โอนกดยกเลิกได้ - 2 ไฟล์ ===
async function buyAndGoTransfer(listingId, cardId, title, sellerMemberNo){
  try{
    const {data:{user}} = await supa.auth.getUser();
    if(!user){ showModal('ต้องล็อกอินก่อนซื้อ'); return; }
    const {data:cust} = await supa.from('customers').select('member_no,email').eq('email', user.email).maybeSingle();
    const buyerMemberNo = cust?.member_no || null;
    const buyerEmail = user.email;
    if(!buyerMemberNo){ showModal('ไม่พบรหัสสมาชิก กรุณาไป my-account'); return; }
    if(!confirm(`ยืนยันซื้อ ${title||cardId} ?`)) return;
    
    // 1. Lock listing -> reserved
    const {error: lockErr} = await supa.from('market_listings').update({status:'reserved', buyer_member_no:buyerMemberNo, buyer_email:buyerEmail, reserved_at:new Date().toISOString()}).eq('id', listingId).eq('status','active');
    if(lockErr){ showModal('ซื้อไม่สำเร็จ (อาจมีคนซื้อตัดหน้า): '+lockErr.message); return; }
    
    // 2. Create transfer record
    const transferPayload = {
      card_id: cardId,
      card_title: title||'',
      from_member_no: parseInt(String(sellerMemberNo).replace('CM-',''))||null,
      from_email: '',
      to_member_no: buyerMemberNo,
      to_email: buyerEmail,
      fee_mode: 'free',
      fee: 0,
      fee_amount: 0,
      status: 'pending_transfer',
      created_by: buyerEmail,
      note: `ซื้อจากตลาด Trade - listing ${listingId}`
    };
    const {data: tr, error: trErr} = await supa.from('ownership_transfers').insert(transferPayload).select().maybeSingle();
    if(trErr){ 
      // rollback
      await supa.from('market_listings').update({status:'active', buyer_member_no:null}).eq('id', listingId);
      showModal('สร้างรายการโอนไม่สำเร็จ: '+trErr.message); return; 
    }
    const transferId = tr?.id || listingId;
    showModal(`✅ จองสำเร็จ! กำลังไปหน้าโอนกรรมสิทธิ์\n\nถ้าไม่โอน กดยกเลิกได้ จะคืนการ์ดเข้าตลาดทันที`);
    setTimeout(()=>{ window.location.href = `/transfer-fee?id=${transferId}&card=${encodeURIComponent(cardId)}&listing=${listingId}`; }, 800);
  }catch(e){ showModal('Error: '+e.message); }
}


// === BAN FLOW: อายัดการ์ดคนแบน -> คืนตลาด ===
let bannedCache = new Set();
async function getBannedMembers(){
  try{
    const client = window.supabaseClient || (typeof supa!=='undefined'?supa:null) || supabase.createClient('https://mgandefbbgvlfqqzfnoe.supabase.co','sb_publishable_36w7K1aKe2kUzLmQXqpWfA_gMsePh9h');
    if(!client) return bannedCache;
    const {data} = await client.from('customers').select('member_no').eq('is_banned', true).limit(100);
    if(data){
      bannedCache = new Set(data.map(d=> String(d.member_no)));
      // also add CM- formatted
      data.forEach(d=>{ bannedCache.add('CM-'+String(d.member_no).padStart(4,'0')); });
    }
    return bannedCache;
  }catch(e){ return bannedCache; }
}
async function filterBannedListings(listings){
  const banned = await getBannedMembers();
  if(banned.size===0) return listings;
  return listings.filter(l=> {
    const no = String(l.seller_member_no||'');
    const num = no.replace('CM-','');
    return !banned.has(no) && !banned.has(num) && !banned.has('CM-'+num.padStart(4,'0'));
  });
}

// === CM D1/R2 FIX - UI เดิม 100% - แก้เฉพาะโค้ดดึงข้อมูล ===
// FIXED V3 - using window.CM_R2_API
const CM_R2_API = window.CM_R2_API || "https://r2-proxy.vasan-jitpim.workers.dev";
const CM_D1_API = CM_R2_API + "/api";
async function cmFetchD1(path, fallbackFn){
  try{
    const ctrl = new AbortController(); setTimeout(()=>ctrl.abort(), 3000);
    const r = await fetch(CM_D1_API + path, {cache:'no-store', signal: ctrl.signal});
    if(r.ok){ const j = await r.json(); if(j) return j; }
  }catch(e){}
  if(typeof fallbackFn==='function'){ try{ return await fallbackFn(); }catch(e){} }
  return [];
}
async function cmUploadR2(fileOrBlob, fileName, extra={}){
  try{
    const fd = new FormData();
    fd.append('file', fileOrBlob, fileName);
    for(const k in extra) fd.append(k, extra[k]);
    const r = await fetch(CM_R2_API, {method:'POST', body: fd});
    const j = await r.json();
    return j.url || j.image_url || null;
  }catch(e){ return null; }
}
const CM_ADMIN_EMAIL = "vasan.jitpim@gmail.com";
const CM_ADMIN_CM = "CM-0000";
function cmIsAdmin(email, memberNo){
  const e = (email||"").toLowerCase();
  const cm = (memberNo||"").toString().toUpperCase();
  return e===CM_ADMIN_EMAIL || cm===CM_ADMIN_CM || cm==="0" || cm==="CM-0000";
}

function nextImg(){curIdx=(curIdx+1)%8;showDetail();resetZoom();}
function prevImg(){curIdx=(curIdx-1+8)%8;showDetail();resetZoom();}
function resetZoom(){scale=1;lastScale=1;posX=0;posY=0;updateTransform();}
function updateTransform(){document.getElementById('detailMainImg').style.transform=`translate(${posX}px, ${posY}px) scale(${scale})`;}
function openLightbox(){if(!curCard)return;document.getElementById('lightbox').classList.remove('hidden');document.getElementById('lightbox').classList.add('flex');syncLightbox();resetLbZoom();}
function closeLightbox(){document.getElementById('lightbox').classList.add('hidden');document.getElementById('lightbox').classList.remove('flex');resetLbZoom();}
function syncLightbox(){if(!curCard)return;document.getElementById('lbImg').src=curCard.imgs[curIdx];const row=document.getElementById('lbThumbs');row.innerHTML='';curCard.imgs.forEach((src,i)=>{const l=curCard.labels[i];row.innerHTML+=`<div onclick="curIdx=${i};syncLightbox();showDetail();resetLbZoom()" class="flex-shrink-0 cursor-pointer relative"><img src="${src}" class="w-12 h-16 rounded-lg object-cover border-2 ${i===curIdx?'border-yellow-400':'border-white/10'}"><div class="absolute bottom-0 left-0 right-0 bg-black/70 text-[5px] text-center">${l.short}</div></div>`;});}
function lbNext(){curIdx=(curIdx+1)%8;syncLightbox();showDetail();resetLbZoom();}
function lbPrev(){curIdx=(curIdx-1+8)%8;syncLightbox();showDetail();resetLbZoom();}
function resetLbZoom(){lbScale=1;lbLastScale=1;lbPosX=0;lbPosY=0;updateLbTransform();}
function updateLbTransform(){document.getElementById('lbImg').style.transform=`translate(${lbPosX}px, ${lbPosY}px) scale(${lbScale})`;}
const detailContainer=document.getElementById('detailZoomContainer');
detailContainer.addEventListener('touchstart',e=>{if(e.touches.length===1){isDrag=true;startX=e.touches[0].clientX-posX;startY=e.touches[0].clientY-posY;}else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;startDist=Math.hypot(dx,dy);lastScale=scale;}},{passive:false});
detailContainer.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1&&isDrag){if(scale>1){posX=e.touches[0].clientX-startX;posY=e.touches[0].clientY-startY;updateTransform();}}else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;const dist=Math.hypot(dx,dy);scale=Math.min(5,Math.max(1,lastScale*dist/startDist));updateTransform();}},{passive:false});
detailContainer.addEventListener('touchend',e=>{if(e.touches.length===0){isDrag=false;if(scale===1){const touch=e.changedTouches[0];const diff=touch.clientX-(startX+posX);if(Math.abs(diff)>60){if(diff<0)nextImg();else prevImg();}}const now=Date.now();if(now-lastTap<300){if(scale===1){scale=2.5;}else{scale=1;posX=0;posY=0;}updateTransform();}lastTap=now;}},{passive:false});
const lbWrap=document.getElementById('lbWrap');
lbWrap.addEventListener('touchstart',e=>{if(e.touches.length===1){lbDrag=true;lbStartX=e.touches[0].clientX-lbPosX;lbStartY=e.touches[0].clientY-lbPosY;}else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;lbStartDist=Math.hypot(dx,dy);lbLastScale=lbScale;}},{passive:false});
lbWrap.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1&&lbDrag){lbPosX=e.touches[0].clientX-lbStartX;lbPosY=e.touches[0].clientY-lbStartY;updateLbTransform();}else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;const dist=Math.hypot(dx,dy);lbScale=Math.min(6,Math.max(1,lbLastScale*dist/lbStartDist));updateLbTransform();}},{passive:false});
lbWrap.addEventListener('touchend',e=>{if(e.touches.length===0){lbDrag=false;if(lbScale===1){const touch=e.changedTouches[0];const diff=touch.clientX-(lbStartX+lbPosX);if(Math.abs(diff)>70){if(diff<0)lbNext();else lbPrev();}}const now=Date.now();if(now-lbLastTap<300){if(lbScale===1){lbScale=3;}else{lbScale=1;lbPosX=0;lbPosY=0;}updateLbTransform();}lbLastTap=now;lbLastScale=lbScale;}},{passive:false});
document.getElementById('searchInput').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();if(!q){render(allCards);return;}const f=allCards.filter(c=>c.name.toLowerCase().includes(q)||c.code.toLowerCase().includes(q)||c.memberNo.toLowerCase().includes(q)||c.qr.toLowerCase().includes(q));render(f);});
let html5QrcodeScanner=null;
function openSellModal(){document.getElementById('qrModal').classList.remove('hidden'); setTimeout(()=>{html5QrcodeScanner=new Html5Qrcode("reader"); html5QrcodeScanner.start({facingMode:"environment"}, {fps:10, qrbox:250}, (decoded)=>{document.getElementById('manualQR').value=decoded.split('/').pop(); verifyQR(); html5QrcodeScanner.stop();}, ()=>{}).catch(()=>{});},300);}
function closeQR(){document.getElementById('qrModal').classList.add('hidden'); if(html5QrcodeScanner){html5QrcodeScanner.stop().catch(()=>{});}}
async function verifyQR(){const code=document.getElementById('manualQR').value.trim().toUpperCase(); const res=document.getElementById('qrResult'); res.classList.remove('hidden'); if(!code){res.className='p-3 rounded-xl text-[11px] bg-red-500/20 text-red-300'; res.innerText='กรอก QR ก่อน'; return;} const found=allCards.some(c=>c.qr===code)||code.startsWith('CM-'); if(found){res.className='p-3 rounded-xl text-[11px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'; res.innerHTML=`✅ QR <b>${code}</b> มีจริง<br><button onclick="showModal('ไปหน้าลงขาย')" class="mt-2 bg-emerald-500 text-black px-4 py-2 rounded-full font-bold text-[11px]">ไปหน้าลงขาย</button>`;}else{res.className='p-3 rounded-xl text-[11px] bg-red-500/20 text-red-300 border border-red-500/30'; res.innerHTML=`❌ QR <b>${code}</b> ไม่มีในระบบ`;}}
</script>

<script>
// CM Modal Fix - แก้ alert/confirm เป็น Modal แดงขาวเหลือง ไม่เปลี่ยนธีม
function showModal(msg, title){
  title = title || 'แจ้งเตือน';
  const m = document.getElementById('cmModal');
  if(!m){ alert(msg); return; } // FIXED recursion
  document.getElementById('cmModalTitle').textContent = title;
  document.getElementById('cmModalMsg').textContent = msg;
  document.getElementById('cmModalActions').innerHTML = '<button onclick="closeCMModal()" class="px-6 py-2.5 bg-yellow-400 text-black font-bold rounded-xl hover:bg-yellow-300 transition">ตกลง</button>';
  m.classList.remove('hidden');
}
function showModalConfirm(msg, title, onOk){
  title = title || 'ยืนยัน';
  const m = document.getElementById('cmModal');
  if(!m){ if(confirm(msg) && onOk) onOk(); return; }
  document.getElementById('cmModalTitle').textContent = title;
  document.getElementById('cmModalMsg').textContent = msg;
  document.getElementById('cmModalActions').innerHTML = '<button onclick="closeCMModal()" class="px-5 py-2.5 bg-white/10 text-white rounded-xl border border-white/20 mr-2">ยกเลิก</button><button id="cmConfirmOk" class="px-6 py-2.5 bg-yellow-400 text-black font-bold rounded-xl hover:bg-yellow-300 transition">ยืนยัน</button>';
  m.classList.remove('hidden');
  document.getElementById('cmConfirmOk').onclick = function(){ closeCMModal(); onOk&&onOk(); };
}
function closeCMModal(){
  const m = document.getElementById('cmModal');
  if(m) m.classList.add('hidden');
}
</script>


<script>
let currentTab = 'all'; // all, qr, raw
const MARKET_URL = window.location.href.split('?')[0];
function shareMarket(){ if(navigator.share){ navigator.share({title:'Matem Raw Market', url:MARKET_URL}); } else { navigator.clipboard.writeText(MARKET_URL); showModal('คัดลอกลิ้งแล้ว: '+MARKET_URL); } }
function showMarketQR(){ showModal('QR ตลาด: '+MARKET_URL+'\nเอาไปแปะหน้าร้านได้เลย'); }
function switchTab(tab){
  currentTab = tab;
  document.getElementById('tabQR').className = tab==='qr' ? 'bg-green-600 text-white py-2.5 rounded-xl text-[11px] font-bold border-2 border-green-400' : 'bg-zinc-800 border border-white/10 text-zinc-400 py-2.5 rounded-xl text-[11px] font-bold';
  document.getElementById('tabRaw').className = tab==='raw' ? 'bg-orange-500 text-white py-2.5 rounded-xl text-[11px] font-bold border-2 border-orange-400' : 'bg-zinc-800 border border-orange-500/30 text-zinc-300 py-2.5 rounded-xl text-[11px] font-bold';
  if(tab==='all'){ render(allCards); return; }
  allCards = await filterBannedListings(allCards);
  let filtered = allCards.filter(c=> tab==='qr' ? c.qr : !c.qr || c.has_qr===false);
  // For demo, use qr field existence
  if(tab==='qr') filtered = allCards.filter(c=> c.qr && c.qr.startsWith('CM-'));
  else filtered = allCards.filter(c=> !c.qr || !c.qr.startsWith('CM-'));
  render(filtered);
}
async function checkQuotaAndExpiry(){
  const myNo = localStorage.getItem('member_no') || 'CM-0000';
  const qEl = document.getElementById('quotaInfo');
  const cQR = document.getElementById('countQR');
  const cRaw = document.getElementById('countRaw');
  // FIXED: ใช้ข้อมูลจริงจาก Supabase ถ้ามี ไม่งั้นใช้ allCards เป็น fallback
  let rawCount = 0, qrCount = 0;
  try{
    if(window.supabaseClient || typeof supa !== 'undefined'){
      const client = window.supabaseClient || supa || supabase.createClient('https://mgandefbbgvlfqqzfnoe.supabase.co','sb_publishable_36w7K1aKe2kUzLmQXqpWfA_gMsePh9h');
      const {data} = await client.from('market_listings').select('seller_member_no, has_qr, status, card_id, id').eq('status','active');
      if(data){
        rawCount = data.filter(d=> !d.has_qr).length;
        qrCount = data.filter(d=> d.has_qr).length;
        const myRaw = data.filter(d=> (d.seller_member_no===myNo || d.seller_member_no===myNo.replace('CM-','')) && !d.has_qr).length;
        const myQR = data.filter(d=> (d.seller_member_no===myNo || d.seller_member_no===myNo.replace('CM-','')) && d.has_qr).length;
        if(qEl) qEl.innerHTML = `คุณ ${myNo} | 📦 Raw ${myRaw}/10 | 🏆 QR ${myQR}/ไม่จำกัด`;
        if(myRaw>=10){ showModal('📦 Raw ครบ 10 ใบแล้ว ส่ง Pregrade 200฿ เพื่อลงได้ไม่จำกัด'); }
      }
    }
  }catch(e){}
  // fallback
  if(rawCount===0 && qrCount===0 && typeof allCards !== 'undefined'){
    rawCount = allCards.filter(c=> !c.qr || c.isRaw).length;
    qrCount = allCards.filter(c=> c.qr).length;
  }
  if(cQR) cQR.innerText = qrCount;
  if(cRaw) cRaw.innerText = rawCount;
  // FIXED: เช็คบัตรหมดอายุ 15+5=20 วัน
  const now = new Date();
  if(typeof allCards !== 'undefined'){
    allCards.forEach(c=>{
      if(c.isRaw && c.created_at){
        const exp = new Date(c.created_at); exp.setDate(exp.getDate()+15);
        const grace = new Date(exp); grace.setDate(grace.getDate()+5);
        const diff = now - exp;
        const diffGrace = now - grace;
        if(diff>0 && diffGrace<=0){ c.status='expired'; }
        if(diffGrace>0){ c.toDelete=true; }
      }
    });
  }
}
async function autoExpireInDB(){
  try{
    const client = window.supabaseClient || (typeof supa!=='undefined'?supa:null) || (typeof supabase!=='undefined'?supabase.createClient('https://mgandefbbgvlfqqzfnoe.supabase.co','sb_publishable_36w7K1aKe2kUzLmQXqpWfA_gMsePh9h'):null);
    if(!client) return;
    const now = new Date().toISOString();
    const {data: expireds} = await client.from('market_listings').select('id,expires_at').eq('status','active').lt('expires_at', now).limit(50);
    if(expireds && expireds.length){
      for(const r of expireds){
        await client.from('market_listings').update({status:'expired', updated_at: new Date().toISOString()}).eq('id', r.id);
        await client.from('market_cards').update({status:'expired'}).eq('id', r.id);
      }
      console.log('Auto expired', expireds.length);
    }
  }catch(e){ console.warn('autoExpire fail', e); }
}
setTimeout(()=>{ checkQuotaAndExpiry(); autoExpireInDB(); }, 1500);
setInterval(autoExpireInDB, 60*1000);

</script>


<script>
let activeFilters={type:'all',owner:'all'};
function setFilter(k,v){activeFilters[k]=v; applyAdvancedFilter();}
function applyAdvancedFilter(){
  const min=parseFloat(document.getElementById('priceMin').value)||0;
  const max=parseFloat(document.getElementById('priceMax').value)||999999;
  const sort=document.getElementById('sortBy').value;
  let filtered=[...allCards];
  if(activeFilters.type==='qr') filtered=filtered.filter(c=>c.qr && c.qr.startsWith('CM-'));
  if(activeFilters.type==='raw') filtered=filtered.filter(c=>!c.qr);
  if(activeFilters.owner==='my'){ let myNo=''; try{myNo=localStorage.getItem('member_no')||'';}catch(e){} if(myNo) filtered=filtered.filter(c=>(c.seller_member_no||'')===myNo); }
  filtered=filtered.filter(c=>{ const p=parseFloat(c.price||0); return p>=min && p<=max; });
  const kw=(document.getElementById('searchInput').value||'').toLowerCase();
  if(kw){ const kwNorm = kw.toLowerCase(); const kwNum = kwNorm.replace(/^cm-?/, '').trim(); if(kwNorm.startsWith('cm-')){ filtered=filtered.filter(c=> (c.seller_member_no||'').toLowerCase()===kwNorm || (c.seller_member_no||'').toLowerCase()===('cm-'+kwNum.padStart(4,'0')) || String(c.seller_member_no||'').toLowerCase()===kwNum); } else { filtered=filtered.filter(c=> (c.name||'').toLowerCase().includes(kwNorm) || (c.seller_member_no||'').toLowerCase().includes(kwNorm)); } }
  if(sort==='priceLow') filtered.sort((a,b)=>parseFloat(a.price||0)-parseFloat(b.price||0));
  if(sort==='priceHigh') filtered.sort((a,b)=>parseFloat(b.price||0)-parseFloat(a.price||0));
  if(sort==='newest') filtered.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  if(sort==='expiry') filtered.sort((a,b)=>new Date(a.expiry_at||'2099')-new Date(b.expiry_at||'2099'));
  document.getElementById('searchResult').innerText=`เจอ ${filtered.length} ใบ`;
  render(filtered);
}
</script>
