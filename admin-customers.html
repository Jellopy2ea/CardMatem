<script>
// === CM D1/R2 FIX - UI เดิม 100% - แก้เฉพาะโค้ดดึงข้อมูล ===
// FIXED V3 - using window.CM_R2_API
const CM_R2_API = window.CM_R2_API || "https://r2-proxy.vasan-jitpim.workers.dev";
const CM_D1_API = CM_R2_API + "/api";
async function cmFetchD1(path, fallbackFn){
  try{
    const ctrl = new AbortController(); setTimeout(()=>ctrl.abort(), 3000);
    const r = await fetch(CM_D1_API + path, {cache:'no-store', signal: ctrl.signal});
    if(r.ok){ const j = await r.json(); if(j) return j; }
  }catch(e){}
  if(typeof fallbackFn==='function'){ try{ return await fallbackFn(); }catch(e){} }
  return [];
}
async function cmUploadR2(fileOrBlob, fileName, extra={}){
  try{
    const fd = new FormData();
    fd.append('file', fileOrBlob, fileName);
    for(const k in extra) fd.append(k, extra[k]);
    const r = await fetch(CM_R2_API, {method:'POST', body: fd});
    const j = await r.json();
    return j.url || j.image_url || null;
  }catch(e){ return null; }
}
const CM_ADMIN_EMAIL = "vasan.jitpim@gmail.com";
const CM_ADMIN_CM = "CM-0000";
function cmIsAdmin(email, memberNo){
  const e = (email||"").toLowerCase();
  const cm = (memberNo||"").toString().toUpperCase();
  return e===CM_ADMIN_EMAIL || cm===CM_ADMIN_CM || cm==="0" || cm==="CM-0000";
}

<script>
const SUPABASE_URL='https://mgandefbbgvlfqqzfnoe.supabase.co';
const anonKey='sb_publishable_36w7K1aKe2kUzLmQXqpWfA_gMsePh9h';
const supa=window.supabase.createClient(SUPABASE_URL, anonKey);
const ADMIN_EMAILS = ['vasan.jitpim@gmail.com'];
const PAGE_SIZE=50; let currentPage=1,totalCount=0,searchQuery='',debounceTimer=null;
function log(m,ok=true){document.getElementById('log').innerHTML=`<div>${ok?'✅':'❌'} ${new Date().toLocaleTimeString()} - ${m}</div>`+document.getElementById('log').innerHTML;}
function formatMemberNo(no){if(no===0 || no==='0') return 'CM-0000'; if(no==null) return '-'; return 'CM-'+String(no).padStart(4,'0');}
function parseMemberNo(input){ if(input===0 || input==='0' || String(input).toUpperCase()==='CM-0000') return 0; if(!input && input!==0) return null; const s=String(input).trim().toUpperCase().replace(/^CM-?/,'').trim(); if(!/^\d+$/.test(s)) return null; return parseInt(s,10); }
function onSearchInput(){ clearTimeout(debounceTimer); debounceTimer=setTimeout(()=>{searchQuery=document.getElementById('searchBox').value.trim(); currentPage=1; loadCustomers();},400); }
async function loadCustomers(reset=false){
  if(reset) currentPage=1;
  const from=(currentPage-1)*PAGE_SIZE, to=from+PAGE_SIZE-1;
  let query=supa.from('customers').select('*',{count:'exact'}).order('member_no',{ascending:true}).range(from,to);
  if(searchQuery){ const mn=parseMemberNo(searchQuery); if(mn!==null){ query=supa.from('customers').select('*',{count:'exact'}).eq('member_no',mn).range(0,50); } else { const p=`%${searchQuery}%`; query=supa.from('customers').select('*',{count:'exact'}).or(`display_name.ilike.${p},email.ilike.${p},phone.ilike.${p}`).order('member_no').range(from,to);} }
  const {data,error,count}=await query;
  if(error){ log(error.message,false); return; }
  totalCount=count||0; document.getElementById('countLabel').innerText=`เจอ ${totalCount} คน`; document.getElementById('pageInfo').innerText=`หน้า ${currentPage} / ${Math.ceil(totalCount/PAGE_SIZE)}`;
  // นับการ์ดต่อคน
  const memberNos=data.map(c=>c.member_no).filter(n=>n!=null);
  let cardCounts={};
  if(memberNos.length){ const {data:cards}=await supa.from('cards').select('owner_member_no').in('owner_member_no', memberNos); (cards||[]).forEach(r=>{ cardCounts[r.owner_member_no]=(cardCounts[r.owner_member_no]||0)+1; }); }
  document.getElementById('tbody').innerHTML=data.map(c=>{
    const cnt=cardCounts[c.member_no]||0;
    return `<tr class="border-b border-white/5 hover:bg-white/5"><td class="p-3"><span class="bg-yellow-400 text-black text-[10px] font-black px-2 py-0.5 rounded-full">${formatMemberNo(c.member_no)}</span></td><td class="p-3"><div class="font-bold">${c.display_name||'-'}</div><div class="text-[10px] text-zinc-500">${c.email||''}</div></td><td class="p-3">${c.phone||'-'}</td><td class="p-3 text-center"><span class="${cnt>0?'bg-red-500/20 text-red-300 border border-red-500/30':'bg-zinc-800 text-zinc-500'} text-[10px] px-2 py-1 rounded-full font-bold">${cnt} ใบ</span></td><td class="p-3 text-[10px] text-zinc-500">${c.created_at?new Date(c.created_at).toLocaleDateString('th-TH'):''}</td><td class="p-3 text-center"><button onclick="deleteCustomer(${c.member_no},'${(c.email||'').replace(/'/g,'')}',${cnt})" class="bg-red-900/50 border border-red-500/30 text-red-300 px-3 py-1 rounded-full text-[10px]">ลบ</button></td></tr>`;
  }).join('');
}
function prevPage(){ if(currentPage>1){currentPage--; loadCustomers();} }
function nextPage(){ if(currentPage<Math.ceil(totalCount/PAGE_SIZE)){currentPage++; loadCustomers();} }

// ✅ FIX กันการ์ดผี
async function deleteCustomer(memberNo,email,cardCount){
  if(!memberNo){ showModal('ไม่มี member_no ลบไม่ได้'); return; }
  if(cardCount>0){
    const ok=showModalConfirm(`⚠️ สมาชิก ${formatMemberNo(memberNo)} มีการ์ด ${cardCount} ใบอยู่!\n\nถ้าลบตอนนี้การ์ดจะกลายเป็นผี ไม่มีเจ้าของ\n\nแนะนำ: โอนการ์ดออกก่อนลบ\n\nจะลบต่อจริงๆไหม?`);
    if(!ok) return;
  }
  const t=prompt(`พิมพ์ DELETE เพื่อยืนยันลบ ${formatMemberNo(memberNo)} (${email})`);
  if(t!=='DELETE'){ showModal('ยกเลิก'); return; }
  log(`กำลังลบ ${formatMemberNo(memberNo)} ...`);
  // ✅ FIX: ลบด้วย member_no ไม่ใช่ email
  const {error}=await supa.from('customers').delete().eq('member_no', memberNo);
  if(error){ log('ลบไม่สำเร็จ: '+error.message,false); showModal(error.message); return; }
  log(`ลบ ${formatMemberNo(memberNo)} สำเร็จ`);
  // ✅ แจ้งเตือนการ์ดผีถ้ามี
  if(cardCount>0){ log(`⚠️ มีการ์ด ${cardCount} ใบที่ owner_member_no=${memberNo} ค้างอยู่ ต้องไปเคลียร์ใน cards`, false); showModal(`ลบสมาชิกแล้ว แต่มีการ์ด ${cardCount} ใบค้างเป็นผี\n\nต้องไป UPDATE cards SET owner_member_no = null WHERE owner_member_no = ${memberNo} หรือโอนให้คนอื่น`); }
  loadCustomers();
}
loadCustomers(); log('V3 FIXED พร้อม - กันการ์ดผี + เช็คก่อนลบ + ลบด้วย member_no');
</script>

<script>
// CM Modal Fix - แก้ alert/confirm เป็น Modal แดงขาวเหลือง ไม่เปลี่ยนธีม
function showModal(msg, title){
  title = title || 'แจ้งเตือน';
  const m = document.getElementById('cmModal');
  if(!m){ alert(msg); return; } // FIXED recursion
  document.getElementById('cmModalTitle').textContent = title;
  document.getElementById('cmModalMsg').textContent = msg;
  document.getElementById('cmModalActions').innerHTML = '<button onclick="closeCMModal()" class="px-6 py-2.5 bg-yellow-400 text-black font-bold rounded-xl hover:bg-yellow-300 transition">ตกลง</button>';
  m.classList.remove('hidden');
}
function showModalConfirm(msg, title, onOk){
  title = title || 'ยืนยัน';
  const m = document.getElementById('cmModal');
  if(!m){ if(confirm(msg) && onOk) onOk(); return; }
  document.getElementById('cmModalTitle').textContent = title;
  document.getElementById('cmModalMsg').textContent = msg;
  document.getElementById('cmModalActions').innerHTML = '<button onclick="closeCMModal()" class="px-5 py-2.5 bg-white/10 text-white rounded-xl border border-white/20 mr-2">ยกเลิก</button><button id="cmConfirmOk" class="px-6 py-2.5 bg-yellow-400 text-black font-bold rounded-xl hover:bg-yellow-300 transition">ยืนยัน</button>';
  m.classList.remove('hidden');
  document.getElementById('cmConfirmOk').onclick = function(){ closeCMModal(); onOk&&onOk(); };
}
function closeCMModal(){
  const m = document.getElementById('cmModal');
  if(m) m.classList.add('hidden');
}
</script>
