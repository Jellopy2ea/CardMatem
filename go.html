<!DOCTYPE html>
<html lang="th">
<head>
<script src="common.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Card Matem</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Kanit',sans-serif;background:#f5f5f5;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.card{background:white;border-radius:20px;width:100%;max-width:360px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.15);animation:up .25s ease}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.head{padding:24px 24px 12px 24px;font-size:22px;color:#000;line-height:1.3}
.row{display:flex;align-items:center;gap:12px;padding:12px 24px}
.icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#000,#1a1a2e);border:1px solid #facc15;display:flex;align-items:center;justify-content:center;font-weight:900;color:#facc15}
.name{font-size:16px;font-weight:500;color:#000}
.url{font-size:13px;color:#666}
.btns{display:flex;justify-content:flex-end;gap:8px;padding:12px 12px 16px}
.btn{border:none;background:none;font-size:15px;padding:10px 20px;border-radius:20px;cursor:pointer}
.btn-cancel{color:#1a73e8}
.btn-ok{color:#1a73e8;font-weight:700}
.btn:active{opacity:.6}
.note{font-size:11px;color:#999;text-align:center;padding:0 24px 16px}
</style>
</head>
<body>
<div class="card" id="card">
<div class="head">เปิด Card Matem ใช่หรือไม่</div>
<div class="row">
<div class="icon">CM</div>
<div><div class="name">Card Matem | ดีที่สุด</div><div class="url">www.cardmatem.store</div></div>
</div>
<div class="btns">
<button class="btn btn-cancel" id="cancelBtn">ยกเลิก</button>
<button class="btn btn-ok" id="okBtn">ตกลง</button>
</div>
<div class="note" id="note">สแกนจาก LINE • กดตกลงเพื่อเปิดใน Chrome</div>
</div>

<script>
const TARGET = 'https://www.cardmatem.store/?from=line_qr_chrome';
const isAndroid = /Android/i.test(navigator.userAgent);
const isLine = /Line/i.test(navigator.userAgent);
const isFB = /FBAN|FBAV|Messenger/i.test(navigator.userAgent);
const isInApp = isLine || isFB;

function doOpenChrome(){
  document.getElementById('note').innerHTML='กำลังเปิด Chrome...';
  try{ localStorage.setItem('qr_open','1'); }catch(e){}
  if(isAndroid){
    // 1. Intent ไป Chrome ตรงๆ - เนียนสุด
    location.href = 'intent://www.cardmatem.store/#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(TARGET)+';end';
    setTimeout(function(){
      try{ window.open(TARGET,'_blank'); }catch(e){}
      location.href = TARGET;
    }, 1000);
  }else{
    // iOS
    try{ window.open(TARGET,'_blank'); }catch(e){}
    setTimeout(function(){ location.href = TARGET; }, 400);
  }
}
function doCancel(){
  // FIX V5: ยกเลิกแล้วไม่ลิ้งค์ ไม่ back ไม่วนลูป LINE - แก้ตามสั่งห้ามแก้ธีม
  var noteEl=document.getElementById('note');
  if(noteEl) noteEl.innerHTML='กด <b>ตกลง</b> เพื่อเปิดใน Chrome • ยกเลิก = อยู่หน้านี้ ไม่ลิ้งค์';
}
document.getElementById('okBtn').addEventListener('click', doOpenChrome);
document.getElementById('cancelBtn').addEventListener('click', doCancel);
document.getElementById('card').addEventListener('click', function(e){ e.stopPropagation(); });
document.body.addEventListener('click', function(e){ if(e.target===document.body) doCancel(); });

// Auto-open: ถ้าไม่ใช่ LINE/FB (สแกนจากกล้องธรรมดา) ให้ไป /index ตรงๆเลย ไม่ต้องโชว์การ์ด
window.addEventListener('load', function(){
  if(!isInApp){
    setTimeout(function(){ location.href = TARGET; }, 200);
  }
});
</script>
</body>
</html>
