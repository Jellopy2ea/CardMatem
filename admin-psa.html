  try{
    const num=parseInt(memberNo.replace('CM-',''))||null;
    if(num!==null){
      const {data}=await supa.from('cards').select('qr_code,title,status').eq('owner_member_no', num).limit(30);

        sel.innerHTML='<option value="">-- เลือกการ์ด --</option>'+data.map(c=>`<option value="${c.qr_code}">${c.qr_code} - ${c.title||''} [${c.status||''}]</option>`).join('');

};
