<!DOCTYPE html>
<html lang="th">
<head>

body{font-family:'Kanit',sans-serif}
@media print{ .no-print{display:none !important} body{background:white !important} #sheet{box-shadow:none !important; background:white !important} .sticker{break-inside:avoid; border:0.2mm dashed #ccc !important} @page{size:A4; margin:5mm} }

<body class="bg-[#0a0a0f] text-white min-h-screen p-4">
<div class="max-w-[900px] mx-auto">

<div class="flex justify-between items-center">
<span class="font-black text-[14px]"><span class="text-yellow-400">Card</span> <span class="text-purple-400">Matem</span> <span class="text-[10px] text-zinc-500">QR FLOW V7 FINAL FIXED</span></span>
<span id="libStatus" class="text-[9px] bg-zinc-800 px-2 py-1 rounded-full">เช็ค...</span>
</div>

<div class="mt-4 bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-3 text-[10px] text-emerald-300">
✅ V7 FINAL: กดได้ทุกปุ่ม + QR ขึ้นชัวร์ toCanvas + 3.4x2cm 3ดวง/แถว + เซฟ DB กันการ์ดผี
</div>

<div class="mt-4 bg-[#1e1c24] border border-white/5 rounded-[20px] p-4">
<div class="grid grid-cols-4 gap-2">
<button type="button" onclick="goStep(1)" id="s1" class="py-2.5 rounded-xl text-[11px] font-bold bg-yellow-400 text-black step-active">1.สุ่ม QR</button>
<button type="button" onclick="goStep(2)" id="s2" class="py-2.5 rounded-xl text-[11px] bg-zinc-800">2.เซฟไฟล์</button>
<button type="button" onclick="goStep(3)" id="s3" class="py-2.5 rounded-xl text-[11px] bg-zinc-800">3.สแกน</button>
<button type="button" onclick="goStep(4)" id="s4" class="py-2.5 rounded-xl text-[11px] bg-zinc-800">4.DB</button>
</div>

<div id="step1" class="mt-4">
<div class="grid grid-cols-3 gap-2">
<select id="count" class="bg-black border border-white/10 rounded-xl px-3 py-2.5 text-[12px]"><option value="3">3 ดวง เทส</option><option value="24" selected>24 ดวง</option><option value="60">60 ดวง</option><option value="99">99 ดวง</option></select>
<select id="mode" class="bg-black border border-white/10 rounded-xl px-3 py-2.5 text-[12px]"><option value="qr_scanme" selected>QR 15mm + Scan Me</option><option value="qr_only">QR 18mm อย่างเดียว</option></select>
<button type="button" onclick="gen()" class="bg-yellow-400 text-black font-black py-2.5 rounded-xl text-[12px]">🎲 สุ่ม QR</button>
</div>
<div id="log" class="mt-2 bg-black border border-white/10 rounded-xl p-2 text-[9px] font-mono h-[35px] overflow-auto">พร้อม V7 - กดสุ่มได้เลย</div>
</div>

<div id="step2" class="hidden mt-4">
<div class="grid grid-cols-2 gap-2">
<button type="button" onclick="downloadCSV()" class="bg-zinc-800 border border-white/10 py-3 rounded-xl text-[11px]">📄 CSV รหัส+ลิงก์</button>
<button type="button" onclick="downloadTXT()" class="bg-zinc-800 border border-white/10 py-3 rounded-xl text-[11px]">📝 TXT รหัส</button>
<button type="button" onclick="doPrint()" class="bg-white text-black font-black py-3 rounded-xl text-[11px]">🖨️ ปริ้นท์ A4 3.4x2</button>

</div>
<pre id="preview" class="mt-3 bg-black border border-white/10 rounded-xl p-3 text-[10px] max-h-[120px] overflow-auto">ยังไม่ได้สุ่ม</pre>
</div>

<div id="step3" class="hidden mt-4">
<div class="bg-black border border-white/10 rounded-xl p-3 text-[11px]">
<div class="font-bold text-emerald-300">3️⃣ สแกนเช็ค QR ที่ปริ้นท์</div>
<div class="mt-2 text-[10px] text-zinc-400">เปิดกล้องสแกน QR หรือเปิด card?qr=CM-XXXX</div>
<div class="mt-3 flex gap-2">
<input id="scanInput" placeholder="วางรหัส CM-XXXX ที่สแกนได้" class="flex-1 bg-zinc-900 border border-white/10 rounded-xl px-3 py-2.5 text-[12px]">
<button type="button" onclick="testScan()" class="bg-emerald-500 text-black font-black px-4 py-2.5 rounded-xl text-[11px]">เช็ค</button>
</div>
<div id="scanResult" class="mt-2 text-[10px]"></div>
</div>
</div>

<div id="step4" class="hidden mt-4">
<div class="bg-black border border-yellow-400/20 rounded-xl p-3">
<div class="font-bold text-yellow-300 text-[11px]">4️⃣ เซฟลง Supabase printed_blank</div>
<div id="dbLog" class="mt-2 text-[10px] text-zinc-400">ยังไม่ได้เซฟ</div>
<div class="mt-3 grid grid-cols-2 gap-2">
<button type="button" onclick="saveDB()" class="bg-yellow-400 text-black font-black py-3 rounded-xl text-[12px]">💾 เซฟลง DB กันการ์ดผี</button>
<button type="button" onclick="checkDB()" class="bg-zinc-800 border border-white/10 py-3 rounded-xl text-[11px]">🔍 เช็คว่ามีใน DB ไหม</button>
</div>
</div>
</div>

</div>

<div id="sheet" class="mt-6 bg-white rounded-xl p-[5mm] shadow-xl min-h-[200px] flex flex-wrap gap-[2mm] content-start"></div>

</div>

<script>
const supa = window.supabase ? supabase.createClient('https://mgandefbbgvlfqqzfnoe.supabase.co','sb_publishable_36w7K1aKe2kUzLmQXqpWfA_gMsePh9h') : null;
let codes=[];

function log(m){ const el=document.getElementById('log'); if(el) el.innerHTML='<div>'+new Date().toLocaleTimeString()+' '+m+'</div>'+el.innerHTML; }
function goStep(n){ 
  for(let i=1;i<=4;i++){ 
    const st=document.getElementById('step'+i); if(st) st.classList.toggle('hidden', i!==n);
    const btn=document.getElementById('s'+i); if(btn) btn.className=i===n?'py-2.5 rounded-xl text-[11px] font-bold bg-yellow-400 text-black step-active':'py-2.5 rounded-xl text-[11px] bg-zinc-800 border border-white/10';
  } 
}


// === FIXED V8: Sequential QR - No Random - Auto Fetch MAX ===
function formatQR(seq){ return 'CM-' + String(seq).padStart(6,'0'); }
let currentSeq = 0;
async function getMaxSeqFromDB(){
  try{
    if(typeof supa !== 'undefined' && supa){
      const {data} = await supa.from('cards').select('qr_code').like('qr_code','CM-%').order('created_at',{ascending:false}).limit(5000);
      let max=0;
      if(data){
        data.forEach(c=>{
          const m=(c.qr_code||'').match(/CM-0*(\d+)/);
          if(m){ const n=parseInt(m[1],10); if(n>max) max=n; }
        });
      }
      if(max>0) return max;
    }
  }catch(e){ console.warn(e); }
  try{ const last = parseInt(localStorage.getItem('cm_qr_last_seq')||'0',10); return isNaN(last)?0:last; }catch(e){ return 0; }
}
async function autoNextSeq(){
  const max = await getMaxSeqFromDB();
  currentSeq = max;
  const logEl = document.getElementById('log');
  if(logEl) logEl.innerHTML = '<div>MAX SEQ ปัจจุบัน: '+max+' -> ต่อไปเริ่ม '+ (max+1) +'</div>' + logEl.innerHTML;
  return max;
}
function sequentialCode(){
  currentSeq++;
  localStorage.setItem('cm_qr_last_seq', String(currentSeq));
  return formatQR(currentSeq);
}

function randomCode(){ return sequentialCode(); }

async function gen(){ try{ await autoNextSeq(); }catch(e){ console.warn(e); }

  const libOk = (typeof QRCode !== 'undefined');
  const hasToCanvas = libOk && typeof QRCode.toCanvas === 'function';
  document.getElementById('libStatus').innerText = libOk ? (hasToCanvas ? 'QR lib ✅ toCanvas' : 'QR lib ✅ qrcodejs') : 'QR lib ❌';
  if(!libOk){
    showModal('QR lib ยังไม่โหลด กด Ctrl+F5 รีเฟรช 1 ครั้ง - ต้องเปิดใน Chrome ไม่ใช่ Messenger');
    log('❌ QR lib ไม่พร้อม');
    return;
  }
  const count=parseInt(document.getElementById('count').value)||3;
  const mode=document.getElementById('mode').value;
  const sheet=document.getElementById('sheet');
  sheet.innerHTML=''; codes=[];
  log('สุ่ม '+count+' ดวง '+mode);

  for(let i=0;i<count;i++){
    let c; do{ c=randomCode(); }while(codes.includes(c));
    codes.push(c);
    const url='https://www.cardmatem.store/card?qr='+c;
    const div=document.createElement('div'); div.className='sticker';
    if(mode==='qr_only'){
      div.innerHTML='<div class="w-full flex flex-col items-center justify-center"><canvas data-qr-index="' + i + '" class="qr-canvas" class="qr-canvas" data-qr-canvas="true"+i+'"></canvas><div class="text-[5px] font-mono text-black mt-0.5">'+c+'</div></div>';
    }else{
      div.innerHTML='<canvas data-qr-index="' + i + '" class="qr-canvas" class="qr-canvas" data-qr-canvas="true"+i+'" style="width:15mm;height:15mm;flex-shrink:0"></canvas><div class="flex-1 pl-1"><div class="text-[7px] font-black text-black leading-none">SCAN ME</div><div class="text-[7px] font-mono font-black text-black leading-tight mt-0.5">'+c+'</div><div class="text-[5px] text-zinc-500 leading-none">CARDMATEM.STORE</div><div class="text-[4px] text-zinc-400">เช็คแท้</div></div>';
    }
    sheet.appendChild(div);
    try{
      const canvas=document.querySelector('[data-qr-index="'+i+'"]');
      if(typeof QRCode.toCanvas === 'function'){
        await QRCode.toCanvas(canvas, url, {width: 180, margin: 1, errorCorrectionLevel: 'M'});
      } else {
        const wrapper = canvas.parentElement;
        wrapper.innerHTML = '<div class="qr-wrap" data-wrap-index="' + i + '" id="qr-wrap-'+i+'" style="width:15mm;height:15mm"></div><div class="flex-1 pl-1"><div class="text-[7px] font-black text-black leading-none">SCAN ME</div><div class="text-[7px] font-mono font-black text-black leading-tight mt-0.5">'+c+'</div><div class="text-[5px] text-zinc-500 leading-none">CARDMATEM.STORE</div></div>';
        new QRCode(document.getElementById('qrwrap'+i), {text: url, width: 120, height: 120, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M});
      }
    }catch(e){
      log('QR '+c+' fail '+e.message);
      console.error(e);
    }
  }
  document.getElementById('preview').innerText=codes.map(c=>c+',https://www.cardmatem.store/card?qr='+c).join('\n');
  log('เสร็จ '+count+' ดวง V7');
  goStep(2);
}

function downloadCSV(){ if(!codes.length) return showModal('สุ่มก่อน'); const csv='qr_code,verify_url\n'+codes.map(c=>c+',https://www.cardmatem.store/card?qr='+c).join('\n'); const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='qr_'+Date.now()+'.csv'; a.click(); log('โหลด CSV แล้ว'); }
function downloadTXT(){ if(!codes.length) return showModal('สุ่มก่อน'); const txt=codes.join('\n'); const blob=new Blob([txt],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='qr_'+Date.now()+'.txt'; a.click(); log('โหลด TXT แล้ว'); }
function copyAll(){ if(!codes.length) return showModal('สุ่มก่อน'); navigator.clipboard.writeText(codes.join('\n')).then(()=>log('คัดลอกแล้ว')); }
function doPrint(){ if(!codes.length) return showModal('สุ่มก่อน'); setTimeout(()=>window.print(), 300); }

function testScan(){
  const v=document.getElementById('scanInput').value.trim().toUpperCase();
  if(!v) return;
  document.getElementById('scanResult').innerHTML='สแกนได้: <b>'+v+'</b><br><a href="/card?qr='+v+'" target="_blank" class="text-yellow-400">เปิด card?qr='+v+'</a>';
}

async function saveDB(){
  if(!codes.length) return showModal('สุ่มก่อน');
  if(!supa) return showModal('Supabase ไม่พร้อม');
  document.getElementById('dbLog').innerText='กำลังเซฟ...';
  try{
    let ok=0, skip=0;
    for(let i=0;i<codes.length;i++){
      const c=codes[i];
      // FIX V5: กันชน printed_blank vs Verified - ถ้ามีแล้วเป็น Verified ไม่ทับ
      const {data:ex}=await supa.from('cards').select('status').eq('qr_code', c).maybeSingle();
      if(ex){
        if(ex.status==='Verified' || ex.status==='OnPSA' || ex.status==='for_sale'){
          skip++;
          continue; // มีแล้วเป็นของจริง ห้ามทับเป็น printed_blank
        }
        // ถ้ามีแล้วเป็น printed_blank ให้ข้าม ไม่ insert ซ้ำ
        if(ex.status==='printed_blank'){ skip++; continue; }
      }
      const {error}=await supa.from('cards').insert({qr_code:c, status:'printed_blank', title:c, created_at:new Date().toISOString()});
      if(!error) ok++; else document.getElementById('dbLog').innerHTML+='<br>❌ '+c+' '+error.message;
    }
    document.getElementById('dbLog').innerHTML='✅ เซฟแล้ว '+ok+' ดวง printed_blank (ข้าม '+skip+' ดวงที่มีแล้วเป็น Verified)';
    log('เซฟ DB '+ok+' ดวง ข้าม '+skip);
  }catch(e){ document.getElementById('dbLog').innerText='Error '+e.message; }
}

async function checkDB(){
  if(!codes.length) return showModal('สุ่มก่อน');
  if(!supa) return showModal('Supabase ไม่พร้อม');
  document.getElementById('dbLog').innerText='เช็ค...';
  try{
    const {data}=await supa.from('cards').select('qr_code,status').in('qr_code', codes.slice(0,10));
    document.getElementById('dbLog').innerHTML='เจอ '+(data?.length||0)+' / 10 ใบแรก<br>'+(data||[]).map(d=>d.qr_code+' - '+d.status).join('<br>');
  }catch(e){ document.getElementById('dbLog').innerText=e.message; }
}

setTimeout(()=>{
  const ok = typeof QRCode !== 'undefined';
  document.getElementById('libStatus').innerText = ok ? 'QR lib ✅ พร้อม V7' : 'QR lib ❌ รีเฟรช';
  console.log('V7 check', ok);
}, 1000);
</script>

<!-- CM Modal Red White Yellow - Fixed Bug ไม่เปลี่ยนธีม -->
<div id="cmModal" class="fixed inset-0 z-[9999] hidden">
  <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeCMModal()"></div>
  <div class="relative min-h-screen flex items-center justify-center p-4">
    <div class="bg-red-500/20 backdrop-blur-xl border-2 border-yellow-400/50 rounded-2xl max-w-md w-full shadow-2xl">
      <div class="p-6">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-10 h-10 rounded-full bg-yellow-400/20 flex items-center justify-center">⚠️</div>
          <h3 id="cmModalTitle" class="text-white font-bold text-lg">แจ้งเตือน</h3>
        </div>
        <p id="cmModalMsg" class="text-white/90 mb-6 whitespace-pre-line"></p>
        <div id="cmModalActions" class="flex gap-3 justify-end"></div>
      </div>
    </div>
  </div>
</div>


<script>
// CM Modal Fix - แก้ alert/confirm เป็น Modal แดงขาวเหลือง ไม่เปลี่ยนธีม
function showModal(msg, title){
  title = title || 'แจ้งเตือน';
  const m = document.getElementById('cmModal');
  if(!m){ alert(msg); return; } // FIXED recursion
  document.getElementById('cmModalTitle').textContent = title;
  document.getElementById('cmModalMsg').textContent = msg;
  document.getElementById('cmModalActions').innerHTML = '<button onclick="closeCMModal()" class="px-6 py-2.5 bg-yellow-400 text-black font-bold rounded-xl hover:bg-yellow-300 transition">ตกลง</button>';
  m.classList.remove('hidden');
}
function showModalConfirm(msg, title, onOk){
  title = title || 'ยืนยัน';
  const m = document.getElementById('cmModal');
  if(!m){ if(confirm(msg) && onOk) onOk(); return; }
  document.getElementById('cmModalTitle').textContent = title;
  document.getElementById('cmModalMsg').textContent = msg;
  document.getElementById('cmModalActions').innerHTML = '<button onclick="closeCMModal()" class="px-5 py-2.5 bg-white/10 text-white rounded-xl border border-white/20 mr-2">ยกเลิก</button><button id="cmConfirmOk" class="px-6 py-2.5 bg-yellow-400 text-black font-bold rounded-xl hover:bg-yellow-300 transition">ยืนยัน</button>';
  m.classList.remove('hidden');
  document.getElementById('cmConfirmOk').onclick = function(){ closeCMModal(); onOk&&onOk(); };
}
function closeCMModal(){
  const m = document.getElementById('cmModal');
  if(m) m.classList.add('hidden');
}
</script>
