<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Generator - Card Matem -> go.html</title>
<script src="common.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Kanit',sans-serif}#centerWrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;width:100%}</style>
</head>
<body class="bg-[#08080a] m-0 p-0">
<div id="centerWrap" class="p-4">
<div class="w-full max-w-[380px] flex flex-col items-center justify-center">
<div class="w-full bg-white rounded-[22px] p-[14px] shadow-[0_0_60px_rgba(250,204,21,0.25)]">
<canvas id="finalCanvas" width="700" height="760" class="w-full h-auto rounded-[14px] block"></canvas>
<div id="qrDiv" class="hidden"></div>
</div>
<div class="mt-4 grid grid-cols-2 gap-2 w-full max-w-[380px]">
<button onclick="downloadPNG()" class="bg-[#facc15] text-black font-black py-3.5 rounded-[14px] text-[13px]">📥 เซฟ PNG</button>
<button onclick="downloadHiRes()" class="bg-white text-black font-black py-3.5 rounded-[14px] text-[13px]">🖨️ 4K</button>
</div>
<div id="status" class="mt-3 text-[10px] text-zinc-500 text-center">กำลังสร้าง QR ไป /go<br><span class="text-[9px] text-emerald-400">แก้แล้ว: ยิงไป /go รากเว็บ 100%</span></div>
</div>
</div>
<script>
const url='https://www.cardmatem.store/go';
function makeQR(){
  const d=document.getElementById('qrDiv'); d.innerHTML='';
  new QRCode(d,{text:url,width:600,height:600,colorDark:'#000000',colorLight:'#FFFFFF',correctLevel:QRCode.CorrectLevel.H});
  setTimeout(drawFinal,600);
}
function drawFinal(){
  const src=document.querySelector('#qrDiv canvas')||document.querySelector('#qrDiv img');
  const c=document.getElementById('finalCanvas'); const ctx=c.getContext('2d');
  if(!src||(src.tagName==='IMG'&&!src.complete)){ setTimeout(drawFinal,200); return; }
  ctx.fillStyle='white'; ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle='#000000'; ctx.font='900 32px Kanit'; ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('Card Matem', c.width/2, 22);
  const dotY=62;
  [{x:-36,c:'#3b82f6'},{x:-12,c:'#22c55e'},{x:12,c:'#ef4444'},{x:36,c:'#a855f7'}].forEach(o=>{
    ctx.fillStyle=o.c; ctx.beginPath(); ctx.arc(c.width/2+o.x, dotY, 5, 0, Math.PI*2); ctx.fill();
  });
  const qrSize=500; const gap=38; const topArea=80; const bottomArea=80;
  const middleH=c.height - topArea - bottomArea;
  const qrWithGap=qrSize + gap*2;
  const qrX=(c.width-qrSize)/2;
  const qrY=topArea + (middleH - qrWithGap)/2 + gap;
  ctx.drawImage(src, qrX, qrY, qrSize, qrSize);
  const L=24; const thick=5.5; ctx.lineWidth=thick; ctx.lineCap='square';
  ctx.strokeStyle='#3b82f6'; ctx.beginPath(); ctx.moveTo(qrX-gap, qrY-gap+L); ctx.lineTo(qrX-gap, qrY-gap); ctx.lineTo(qrX-gap+L, qrY-gap); ctx.stroke();
  ctx.strokeStyle='#22c55e'; ctx.beginPath(); ctx.moveTo(qrX+qrSize+gap-L, qrY-gap); ctx.lineTo(qrX+qrSize+gap, qrY-gap); ctx.lineTo(qrX+qrSize+gap, qrY-gap+L); ctx.stroke();
  ctx.strokeStyle='#ef4444'; ctx.beginPath(); ctx.moveTo(qrX-gap, qrY+qrSize+gap-L); ctx.lineTo(qrX-gap, qrY+qrSize+gap); ctx.lineTo(qrX-gap+L, qrY+qrSize+gap); ctx.stroke();
  ctx.strokeStyle='#a855f7'; ctx.beginPath(); ctx.moveTo(qrX+qrSize+gap-L, qrY+qrSize+gap); ctx.lineTo(qrX+qrSize+gap, qrY+qrSize+gap); ctx.lineTo(qrX+qrSize+gap, qrY+qrSize+gap-L); ctx.stroke();
  ctx.fillStyle='#000'; ctx.font='900 20px Kanit'; ctx.textAlign='center';
  ctx.fillText('SCAN ME', c.width/2, c.height - 42);
  ctx.fillStyle='#888'; ctx.font='400 11px Kanit';
  ctx.fillText('cardmatem.store/go', c.width/2, c.height - 22);
  document.getElementById('status').innerHTML='✅ QR -> /go พร้อมแล้ว<br><span class="text-[9px] text-emerald-400">ลิงก์: https://www.cardmatem.store/go</span>';
}
function downloadPNG(){ const c=document.getElementById('finalCanvas'); const a=document.createElement('a'); a.href=c.toDataURL('image/png'); a.download='CardMatem-QR-go.png'; a.click(); }
function downloadHiRes(){ const c=document.getElementById('finalCanvas'); const t=document.createElement('canvas'); t.width=2100; t.height=2460; t.getContext('2d').drawImage(c,0,0,2100,2460); const a=document.createElement('a'); a.href=t.toDataURL('image/png'); a.download='CardMatem-QR-go-4K.png'; a.click(); }
window.onload=makeQR;
</script>

<script>
// Fix QR Entrance - เพิ่มปุ่มปริ้น ไม่เปลี่ยนธีม
document.addEventListener('DOMContentLoaded', function(){
  if(!document.getElementById('printBtn')){
    const btn = document.createElement('button');
    btn.id = 'printBtn';
    btn.textContent = 'ปริ้น QR';
    btn.className = 'fixed bottom-6 right-6 px-6 py-3 bg-yellow-400 text-black font-bold rounded-xl shadow-lg';
    btn.onclick = function(){ window.print(); };
    document.body.appendChild(btn);
  }
});
</script>
</body>
</html>
